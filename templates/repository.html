<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Test Repository</title>

    <link rel="stylesheet" href="static/css/pm.css">
</head>

<body>

<div class="header">

    Test Repository

</div>

<div class="page-submenu">
    <a href="/dashboard" class="submenu-link">🏠 Dashboard</a>
    <a href="/test-cases" class="submenu-link">🧪 Test Cases</a>
    <a href="/flow-library" class="submenu-link">🧭 Flow Library</a>
    <a href="/repository" class="submenu-link active">🗂 Repository</a>
    <a href="/Coverage" class="submenu-link">📊 Coverage</a>
    <a href="/reports" class="submenu-link">📈 Reports</a>
    <a href="/risk" class="submenu-link">🛡 Risk</a>
    <a href="/script-studio" class="submenu-link">🤖 Script Studio</a>
</div>

<div class="section">

    <h2>Repository Modules</h2>

    <div class="tiles">

        {% for module in modules %}

        <a href="/repository/{{ module }}" class="tile-link">
            <div class="tile">

                <div class="tile-title">
                    {{ module }}
                </div>

                <div class="tile-desc">
                    Repository Assets
                </div>

            </div>
        </a>

        {% endfor %}

    </div>

</div>

</body>

</html>
